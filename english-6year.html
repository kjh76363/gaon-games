* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body { font-family: 'Fredoka','Jua',sans-serif; background: linear-gradient(170deg,#FFFBE9 0%,#E9F7FF 48%,#E7FBEE 100%);
  min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center; color: #4a4636; }
.kfont { font-family: 'Jua','Fredoka',sans-serif; }
.wrap { width: 100%; max-width: 520px; }
.center { text-align: center; }
.tapcard { transition: transform .12s ease; cursor: pointer; user-select: none; }
.tapcard:active { transform: scale(0.92); }
@keyframes pop { 0%{transform:scale(.6);opacity:0;} 60%{transform:scale(1.12);} 100%{transform:scale(1);opacity:1;} }
@keyframes wiggle { 0%,100%{transform:rotate(-3deg);} 50%{transform:rotate(3deg);} }
@keyframes floaty { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
@keyframes burst { 0%{transform:scale(0) rotate(0);opacity:1;} 100%{transform:scale(1.6) rotate(40deg);opacity:0;} }
.pop { animation: pop .4s cubic-bezier(.2,1.4,.4,1) both; }
.wiggle { animation: wiggle .4s ease-in-out; }
.floaty { animation: floaty 3s ease-in-out infinite; }
.confetti { position: fixed; font-size: 2rem; animation: burst .8s ease-out forwards; pointer-events:none; z-index: 60; }
.stickerflash { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 11vh; z-index: 100; pointer-events: none; }
#critters { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
.verbadge { position: fixed; bottom: 6px; right: 9px; font-size: 0.72rem; color: rgba(90,74,58,.45); z-index: 101; pointer-events: none; font-family: monospace; }
.critter { position: absolute; animation: critterin .5s cubic-bezier(.2,1.5,.4,1) both; filter: drop-shadow(1px 2px 1px rgba(0,0,0,.28)); }
@keyframes critterin { 0%{transform:scale(0) rotate(-20deg);} 70%{transform:scale(1.2);} 100%{transform:scale(1) rotate(var(--rot));} }
input { font-family: 'Fredoka','Jua',sans-serif; }
.grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
h1 { font-size:2.7rem; color:#FF6B6B; margin:8px 0 4px; text-shadow:2px 3px 0 #fff; letter-spacing:1px; }
h2 { font-size:1.7rem; color:#FF6B6B; margin:0; }

var FEMALE_HINT=/female|woman|girl|samantha|victoria|allison|ava|susan|zira|aria|jenny|michelle|eva|joanna|salli|kendra|kimberly|ivy|nicky|google us english/i;
var MALE_HINT=/\bmale\b|david|mark|fred|alex|aaron|daniel|guy|eric|christopher|\btom\b|james|arthur|oliver/i;
function pickVoice(){
  var vs=speechSynthesis.getVoices(); if(!vs||!vs.length) return null;
  function norm(v){return (v.lang||"").replace("_","-").toLowerCase();}
  var us=vs.filter(function(v){return norm(v)==="en-us";});
  var pool=us.length?us:vs.filter(function(v){return norm(v).indexOf("en")===0;});
  if(!pool.length) pool=vs;
  var f=pool.filter(function(v){return FEMALE_HINT.test(v.name);})[0];
  if(f) return f;
  var nm=pool.filter(function(v){return !MALE_HINT.test(v.name);})[0];
  if(nm) return nm;

var sScore=0, sItem=null, sTiles=[], sBuild=[], sStatus=null, sHint=false;
var SHORT = WORDS.filter(function(w){return w.en.indexOf(" ")<0 && /^[a-zA-Z]+$/.test(w.en) && w.en.length>=3 && w.en.length<=7;});
function spell(){ sScore=0; spellSetup(rand(SHORT)); }
function spellSetup(w){
  sItem=w; sBuild=[]; sStatus=null; sHint=false;
  var chars=w.en.toUpperCase().split("");
  var pool=LETTERS.filter(function(c){return chars.indexOf(c)<0;});
  var d1=rand(pool); var pool2=pool.filter(function(c){return c!==d1;}); var d2=rand(pool2);
  var id=0; var all=[];
  chars.forEach(function(c){ all.push({id:id++,ch:c}); });
  all.push({id:id++,ch:d1}); all.push({id:id++,ch:d2});
  sTiles=shuffle(all);
  spellRender(); setTimeout(function(){speak(w.en);},350);
}
function spellNext(){ spellSetup(rand(SHORT)); }
function spellRender(){
  var target=sItem.en.toUpperCase();
  var h=backBar("단어 만들기")+'<div class="center">'+scoreBadge(sScore);
  h+='<div class="tapcard" id="hear" style="background:#BA68C8;border-radius:26px;padding:16px;margin-bottom:14px;border:5px solid #fff;box-shadow:0 8px 22px #BA68C866">'+

  h+='<div style="display:flex;gap:9px;justify-content:center;margin-bottom:20px;flex-wrap:wrap">';
  target.split("").forEach(function(_,i){
    var placed=sBuild[i]!=null;
    var ch=placed? sTiles.filter(function(t){return t.id===sBuild[i];})[0].ch : "";
    h+='<div style="width:54px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:#8E3FA0;'+
       'background:'+(placed?"#fff":"#F6ECFA")+';border:'+(placed?"4px solid #BA68C8":"4px dashed #DCBCE8")+'">'+ch+'</div>';
  });
  h+='</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:64px">';
  sTiles.forEach(function(t){
    var used=sBuild.indexOf(t.id)>=0;
    h+='<div class="tapcard" data-tile="'+t.id+'" style="width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;'+
       'background:'+(used?"#EFE6DA":"#4FC3F7")+';color:'+(used?"#bbb":"#fff")+';box-shadow:'+(used?"none":"0 5px 0 #2BA7E0")+';opacity:'+(used?0.5:1)+'">'+t.ch+'</div>';
  });
  h+='</div>';
  if(sHint) h+='<div class="pop kfont" style="font-size:1.8rem;color:#BA68C8;margin-top:16px">정답: '+target+'</div>';
  h+='<div style="display:flex;gap:10px;margin-top:20px">'+
     '<div class="tapcard" id="hintBtn" style="flex:1;background:#fff;border-radius:18px;padding:13px;font-size:1.1rem;color:#FF8F00;box-shadow:0 4px 0 rgba(0,0,0,.08)">💡 힌트</div>'+
     '<div class="tapcard" id="clearBtn" style="flex:1;background:#fff;border-radius:18px;padding:13px;font-size:1.1rem;color:#888;box-shadow:0 4px 0 rgba(0,0,0,.08)">🧹 지우기</div></div>';
  h+='<div id="fb" style="height:44px;margin-top:14px"></div></div>';
  el(h); bindBack();
  document.getElementById("hear").onclick=function(){speak(sItem.en);};
  document.getElementById("hintBtn").onclick=function(){ sHint=true; speak(sItem.en); spellRender(); };
  document.getElementById("clearBtn").onclick=function(){ if(sStatus!=="good"){ sBuild=[]; sStatus=null; spellRender(); } };
  document.querySelectorAll("[data-tile]").forEach(function(n){
    n.onclick=function(){
      if(sStatus==="good") return;
      var id=+n.getAttribute("data-tile");
      if(sBuild.indexOf(id)>=0) return;
      sBuild.push(id);
      if(sBuild.length===target.length){
        var word=sBuild.map(function(b){return sTiles.filter(function(t){return t.id===b;})[0].ch;}).join("");
        spellRender();
        if(word===target){
          sStatus="good"; sScore++; award(); speak(sItem.en+"! "+rand(PRAISES)); confetti();
          document.getElementById("fb").innerHTML='<div class="pop kfont" style="font-size:1.6rem;color:#56C596">정답이에요! 🎉</div>';
          setTimeout(spellNext,1700);
        } else {
          sStatus="bad"; speak("Try again");
          document.getElementById("fb").innerHTML='<div class="wiggle kfont" style="font-size:1.5rem;color:#FF8A65">다시 한번! 💪</div>';
          setTimeout(function(){ sBuild=[]; sStatus=null; spellRender(); },750);
        }
      } else { spellRender(); }
    };
  });
}

// ===== 문장 만들기 (단어 순서) =====
var SB_ADJ=["big","small","little","cute","happy","funny","fast","new","old","nice","good","tall"];
var SB_COLOR=["red","blue","green","yellow","pink","black","white","brown","orange","purple"];
var SB_ALL=WORDS.filter(function(w){return w.en.indexOf(" ")<0 && /^[a-zA-Z]+$/.test(w.en) && w.en.length<=7;});
var SB_UNC=SB_ALL.filter(function(w){return UNCOUNTABLE[w.en];});
var SB_C=SB_ALL.filter(function(w){return !UNCOUNTABLE[w.en];});
var L1_C=[["I","see","{a}","{w}"],["Look","at","the","{w}"],["It","is","{a}","{w}"],["I","like","the","{w}"],["The","{w}","is","here"],["I","have","{a}","{w}"],["Here","is","{a}","{w}"],["Where","is","the","{w}"]];
var L1_U=[["I","like","{w}"],["I","see","{w}"],["I","want","{w}"]];
var L2_T=[["I","can","see","{a}","{w}"],["Look","at","the","{adj}","{w}"],["The","{w}","is","very","{adj}"],["I","want","to","see","{a}","{w}"],["Can","you","see","the","{w}"],["I","have","{a}","{color}","{w}"],["This","is","my","{adj}","{w}"],["The","{color}","{w}","is","here"],["I","like","the","{adj}","{w}"],["Where","is","the","{adj}","{w}"]];
function sbArt(w){ return "aeiou".indexOf(w.charAt(0))>=0?"an":"a"; }
function genSentence(level){
  var tmpl, noun;
  if(level===1){
    var useU=SB_UNC.length>0 && Math.random()<0.35;
    tmpl=useU?rand(L1_U):rand(L1_C);
    noun=useU?rand(SB_UNC):rand(SB_C);
  } else { tmpl=rand(L2_T); noun=rand(SB_C); }
  var adj=rand(SB_ADJ), color=rand(SB_COLOR);
  var words=tmpl.map(function(t){
    if(t==="{w}") return noun.en;
    if(t==="{adj}") return adj;
    if(t==="{color}") return color;
    return t;
  });
  for(var i=0;i<words.length;i++){ if(words[i]==="{a}") words[i]=sbArt(words[i+1]); }
  var punct=(tmpl[0]==="Where"||tmpl[0]==="Can")?"?":".";
  return {words:words, full:words.join(" ")+punct, emoji:noun.emoji, ko:noun.ko};
}
var sbLevel=1, sbItem=null, sbTiles=[], sbBuild=[], sbStatus=null, sbReveal=false;
function sentenceGame(){ sentLevelSelect(); }
function sentLevelSelect(){
  var h=backBar("문장 만들기")+'<div class="center" style="padding-top:14px">';
  h+='<div class="floaty" style="font-size:3.2rem">✍️</div>';
  h+='<div class="kfont" style="font-size:1.35rem;color:#1f8a7e;margin:8px 0 22px">단계를 골라요!</div>';
  h+='<div style="display:flex;flex-direction:column;gap:16px">';
  h+='<div class="tapcard pop" data-lv="1" style="background:#4DB6AC;border-radius:26px;padding:20px;border:4px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.12)"><div style="font-size:1.7rem;color:#fff;text-shadow:1px 2px 0 rgba(0,0,0,.15)">1단계</div><div class="kfont" style="font-size:1.1rem;color:#ffffffe6">쉬움 · 3~4단어</div></div>';
  h+='<div class="tapcard pop" data-lv="2" style="background:#00897B;border-radius:26px;padding:20px;border:4px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.12)"><div style="font-size:1.7rem;color:#fff;text-shadow:1px 2px 0 rgba(0,0,0,.15)">2단계</div><div class="kfont" style="font-size:1.1rem;color:#ffffffe6">조금 어려움 · 4~6단어</div></div>';
  h+='</div></div>';
  el(h); bindBack();
  document.querySelectorAll("[data-lv]").forEach(function(n){ n.onclick=function(){ sbLevel=+n.getAttribute("data-lv"); sbStart(); }; });
}
function sbTile(id){ return sbTiles.filter(function(t){return t.id===id;})[0]; }
function sbStart(){
  sbItem=genSentence(sbLevel); sbBuild=[]; sbStatus=null; sbReveal=false;
  sbTiles=shuffle(sbItem.words.map(function(w,i){return {id:i,w:w};}));
  sbRender(); setTimeout(function(){speak(sbItem.full);},350);
}
function sbRender(){
  var target=sbItem.words;
  var h=backBar("문장 만들기 "+sbLevel+"단계")+'<div class="center">';
  h+='<div class="tapcard" id="hear" style="background:#26A69A;border-radius:24px;padding:16px;margin-bottom:16px;border:5px solid #fff;box-shadow:0 8px 22px #26A69A66">'+
     '<div style="font-size:2.8rem">'+sbItem.emoji+'</div>'+
     '<div class="kfont" style="font-size:1.2rem;color:#fff">'+sbItem.ko+' · 🔊 문장 다시 듣기</div></div>';
  h+='<div style="display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:18px">';
  target.forEach(function(_,i){
    var placed=sbBuild[i]!=null; var w=placed?sbTile(sbBuild[i]).w:"";
    h+='<div style="min-width:54px;height:50px;padding:0 10px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;font-weight:700;color:#1f7a70;background:'+(placed?"#fff":"#E6F4F2")+';border:'+(placed?"3px solid #26A69A":"3px dashed #B6DED8")+'">'+w+'</div>';
  });
  h+='</div>';
  h+='<div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap;min-height:54px">';
  sbTiles.forEach(function(t){
    var used=sbBuild.indexOf(t.id)>=0;
    h+='<div class="tapcard" data-tile="'+t.id+'" style="padding:13px 15px;border-radius:13px;font-size:1.3rem;font-weight:700;background:'+(used?"#EAE6DA":"#4FC3F7")+';color:'+(used?"#bbb":"#fff")+';box-shadow:'+(used?"none":"0 5px 0 #2BA7E0")+';opacity:'+(used?.5:1)+'">'+t.w+'</div>';
  });
  h+='</div>';
  if(sbReveal) h+='<div class="pop kfont" style="font-size:1.4rem;color:#26A69A;margin-top:16px">정답: '+sbItem.full+'</div>';
  h+='<div style="display:flex;gap:10px;margin-top:20px">'+
     '<div class="tapcard" id="hintBtn" style="flex:1;background:#fff;border-radius:18px;padding:13px;font-size:1.05rem;color:#FF8F00;box-shadow:0 4px 0 rgba(0,0,0,.08)">💡 힌트</div>'+
     '<div class="tapcard" id="clearBtn" style="flex:1;background:#fff;border-radius:18px;padding:13px;font-size:1.05rem;color:#888;box-shadow:0 4px 0 rgba(0,0,0,.08)">🧹 지우기</div></div>';
  h+='<div id="fb" style="height:44px;margin-top:14px"></div></div>';
  el(h); bindBack();
  document.getElementById("hear").onclick=function(){speak(sbItem.full);};
  document.getElementById("hintBtn").onclick=function(){ sbReveal=true; speak(sbItem.full); sbRender(); };
  document.getElementById("clearBtn").onclick=function(){ if(sbStatus!=="good"){ sbBuild=[]; sbStatus=null; sbRender(); } };
  document.querySelectorAll("[data-tile]").forEach(function(n){
    n.onclick=function(){
      if(sbStatus==="good") return;
      var id=+n.getAttribute("data-tile");
      if(sbBuild.indexOf(id)>=0) return;
      var g=memGen;
      sbBuild.push(id);
      if(sbBuild.length===target.length){
        var built=sbBuild.map(function(b){return sbTile(b).w;}).join(" ");
        sbRender();
        if(built===target.join(" ")){
          sbStatus="good"; award(); speak(sbItem.full); confetti();
          document.getElementById("fb").innerHTML='<div class="pop kfont" style="font-size:1.5rem;color:#56C596">정답이에요! 🎉</div>';
          setTimeout(function(){ if(g!==memGen) return; sbStart(); },2100);
        } else {
          sbStatus="bad"; speak("Try again");
          document.getElementById("fb").innerHTML='<div class="wiggle kfont" style="font-size:1.4rem;color:#FF8A65">다시 한번! 💪</div>';
          setTimeout(function(){ if(g!==memGen) return; sbBuild=[]; sbStatus=null; sbRender(); },850);
        }
      } else { sbRender(); }
    };
  });
}

// ===== 짝 맞추기 (기억력) =====
var MEM_POOL=WORDS.filter(function(w){return w.en.indexOf(" ")<0 && /^[a-zA-Z]+$/.test(w.en) && w.en.length<=6;});
var memCards=[], memFirst=-1, memLock=false, memCount=0, memMatched=0, memGen=0;
function memoryGame(){ memStart(); }
function memStart(){
  var counts=[6,8,10]; memCount=rand(counts);
  var chosen=shuffle(MEM_POOL).slice(0,memCount/2);
  var cards=[];
  chosen.forEach(function(w){
    cards.push({key:w.en,kind:"emoji",label:w.emoji});
    cards.push({key:w.en,kind:"word",label:w.en});
  });
  memCards=shuffle(cards).map(function(c,i){ c.id=i; c.flipped=true; c.matched=false; return c; });
  memFirst=-1; memMatched=0; memLock=true;
  var g=memGen; memRender();
  var fb=document.getElementById("fb"); if(fb) fb.innerHTML='<div class="pop kfont" style="font-size:1.35rem;color:#EC407A">잘 기억하세요! 👀</div>';
  setTimeout(function(){
    if(g!==memGen) return;
    memCards.forEach(function(c){ c.flipped=false; });
    memLock=false; memRender();
  }, 2000+memCount*150);
}
function memCols(){ return memCount===6?3:(memCount===8?4:5); }
function memRender(){
  var cols=memCols();
  var h=backBar("짝 맞추기")+'<div class="center">';
  h+='<div class="kfont" style="font-size:1.2rem;color:#EC407A;margin-bottom:14px">그림과 단어 짝을 찾아요! ('+memCount+'장)</div>';
  h+='<div style="display:grid;grid-template-columns:repeat('+cols+',1fr);gap:9px">';
  memCards.forEach(function(c){
    var efs=c.kind==="emoji"?(memCount===6?"3.4rem":memCount===8?"2.8rem":"2.1rem"):(memCount===6?"1.5rem":memCount===8?"1.25rem":"1rem");
    if(c.matched){
      h+='<div style="aspect-ratio:1;min-height:60px;border-radius:16px;background:#E6F7EC;border:4px solid #56C596;display:flex;align-items:center;justify-content:center;opacity:.85">'+
         '<div style="font-size:'+efs+';color:#3DA876;font-weight:700;word-break:break-all">'+c.label+'</div></div>';
    } else if(c.flipped){
      var col=c.kind==="emoji"?"#FFB300":"#4FC3F7";
      h+='<div class="pop" style="aspect-ratio:1;min-height:60px;border-radius:16px;background:#fff;border:4px solid '+col+';display:flex;align-items:center;justify-content:center">'+
         '<div style="font-size:'+efs+';color:'+col+';font-weight:700;word-break:break-all">'+c.label+'</div></div>';
    } else {
      h+='<div class="tapcard" data-card="'+c.id+'" style="aspect-ratio:1;min-height:60px;border-radius:16px;background:linear-gradient(145deg,#9575CD,#7E57C2);border:4px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.12)">'+
         '<div style="font-size:1.8rem;color:#fff">❓</div></div>';
    }
  });
  h+='</div><div id="fb" style="height:44px;margin-top:16px"></div></div>';
  el(h); bindBack();
  document.querySelectorAll("[data-card]").forEach(function(n){
    n.onclick=function(){ memTap(+n.getAttribute("data-card")); };
  });
}
function memTap(id){
  if(memLock) return;
  var c=memCards.filter(function(x){return x.id===id;})[0];
  if(!c||c.flipped||c.matched) return;
  var g=memGen;
  c.flipped=true; speak(c.key);
  if(memFirst===-1){ memFirst=id; memRender(); return; }
  var first=memCards.filter(function(x){return x.id===memFirst;})[0];
  memRender();
  if(first.key===c.key){
    memLock=true;
    setTimeout(function(){
      if(g!==memGen) return;
      first.matched=true; c.matched=true; memMatched++; memFirst=-1; memLock=false; spawnCritter();
      if(memMatched===memCount/2){
        award(); speak(rand(PRAISES)); confetti(); memRender();
        document.getElementById("fb").innerHTML='<div class="pop kfont" style="font-size:1.6rem;color:#56C596">다 맞혔어요! 🎉</div>';
        setTimeout(function(){ if(g!==memGen) return; memStart(); },2100);
      } else { memRender(); }
    },650);
  } else {
    memLock=true;
    setTimeout(function(){ if(g!==memGen) return; first.flipped=false; c.flipped=false; memFirst=-1; memLock=false; memRender(); },1000);
  }
}

// ===== 내 스티커 =====
function stickers(){
  var h=backBar("내 스티커");
  h+='<p class="kfont center" style="font-size:1.4rem;color:#FF8F00;margin:0 0 18px">모은 스티커: '+collected+' / '+STICKERS.length+'</p><div class="grid4">';
  STICKERS.forEach(function(s,i){
    var got=i<collected;
    h+='<div class="'+(got?"pop":"")+'" style="padding:16px 0;text-align:center;font-size:2.2rem;border-radius:20px;'+
       'background:'+(got?"#fff":"#F1E8DB")+';border:'+(got?"4px solid #FFD93D":"4px dashed #DCCBB5")+';box-shadow:'+(got?"0 4px 0 rgba(0,0,0,.08)":"none")+'">'+(got?s:"❓")+'</div>';
  });
  h+='</div>';
  if(collected>0) h+='<div class="tapcard center" id="resetBtn" style="margin-top:20px;background:#fff;border-radius:18px;padding:12px;color:#bbb;font-size:1rem;box-shadow:0 3px 0 rgba(0,0,0,.06)">처음부터 다시 모으기</div>';
  h+='<p class="kfont center" style="color:#9a8a7a;margin-top:16px;font-size:1.05rem">게임에서 정답을 맞히면 스티커가 모여요! 🏆</p>';
  el(h); bindBack();
  var r=document.getElementById("resetBtn");
  if(r) r.onclick=function(){ collected=0; saveStk(0); stickers(); };
}

function go(s){
  clearCritters();
  if(s==="listen") listen();
  else if(s==="first") first();
  else if(s==="spell") spell();
  else if(s==="fill") fillGame();
  else if(s==="sentence") sentenceGame();
  else if(s==="memory") memoryGame();
  else if(s==="stickers") stickers();
  else home();
}
home();
</script>
